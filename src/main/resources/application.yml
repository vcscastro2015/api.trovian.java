spring:
  application:
    name: api-trovian

  # Configuração do PostgreSQL
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:troviandb}
    username: ${DB_USER:trovian}
    password: ${DB_PASSWORD:trovian123}
    driver-class-name: org.postgresql.Driver
    hikari:
      show-sql: false
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # Configuração do JPA/Hibernate
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20

  # Configuração do Liquibase
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
    drop-first: false
    default-schema: public
    liquibase-schema: public
    database-change-log-table: databasechangelog
    database-change-log-lock-table: databasechangeloglock

  # Configuração do ActiveMQ
  activemq:
    broker-url: ${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
    user: ${ACTIVEMQ_USER:admin}
    password: ${ACTIVEMQ_PASSWORD:admin}
    packages:
      trust-all: true

  jms:
    pub-sub-domain: false

  # Configuração do MongoDB
  data:
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DATABASE:troviandb}
      username: ${MONGODB_USER:trovian}
      password: ${MONGODB_PASSWORD:trovian123}
      authentication-database: ${MONGODB_AUTH_DB:admin}

  security:
    user:
      name: ${SECURITY_USER:admin}
      password: ${SECURITY_PASSWORD:admin123}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:seu-email@gmail.com}
    password: ${EMAIL_PASSWORD:sua-senha-de-app}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Configuração do servidor
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

# Logging
logging:
  level:
    root: INFO
    com.trovian: TRACE
    org.springframework.jms: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: always

# JWT Configuration
jwt:
  secret: TrovianSecretKeyMuitoSeguraComMinimo256BitsParaHS256AlgorithmQueDeveSerTrocadaEmProducao
  access-token:
    expiration: 3600000
  refresh-token:
    expiration: 604800000

# Trovian App URL
trovian:
  app:
    url: ${APP_URL:http://localhost:4200}
